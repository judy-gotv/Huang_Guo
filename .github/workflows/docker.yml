# Author: Passwd Word
# 构建前端静态预览镜像并发布到 GHCR（ghcr.io/judy-gotv/huang_guo）。
# 触发：推 main 或手动。镜像只托管 Vite 构建产物（见 Dockerfile 说明），
# 完整桌面/移动端请走仓库自带的 release / build-macos / build-ios 工作流。
name: Docker (GHCR)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: judy-gotv/huang_guo

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  smoke:
    name: Smoke test published image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Run image and check HTTP 200 + title
        run: |
          set -euo pipefail
          docker run -d --name hghub -p 8080:8080 ghcr.io/judy-gotv/huang_guo:latest
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/ > /tmp/index.html && break || sleep 2
          done
          grep -o "<title>[^<]*</title>" /tmp/index.html
          test -s /tmp/index.html
          docker rm -f hghub
